<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Free Account | Aureon Health</title>
<meta content="Register your free Aureon Health client portal account to save quote comparisons and upload documents." name="description"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="../assets/images/favicon.svg" rel="icon" type="image/svg+xml"/><link href="../assets/css/aureon.bundle.css" rel="stylesheet"/></head>
<body class="bg-surface-subtle vh-auth-page page-register aureon-auth-clean">
<!-- TOP UTILITY STRIP -->
<div class="container">
<div class="row justify-content-center">
<div class="col-md-7 col-lg-6">
<div class="p-4 vh-auth-card p-md-5 shadow-lg surebridge-card">
<div class="text-center mb-4">

<a class="navbar-brand-logo d-inline-flex mb-2" href="../index.html">
<img alt="Aureon Health logo" class="brand-logo-mark" src="../assets/images/aureon-health-mark.svg"/><span class="brand-wordmark"><strong>Aureon Health</strong><span>Insurance</span></span></a>
<h3 class="fw-bold mt-2">Create Your Account</h3>
<p class="text-muted small">Manage insurance quotes, active policies, and claim filings in one place.</p>
</div>
<form class="needs-validation" data-vh-register-form="" novalidate="">
<div class="row g-3">
<div class="col-md-6"><label class="form-label small fw-bold">Full Name</label><input class="form-control form-control-lg" name="name" placeholder="Your name" required=""/></div>
<div class="col-md-6"><label class="form-label small fw-bold">Phone</label><input autocomplete="tel" class="form-control form-control-lg" name="phone" placeholder="+91 98765 43210" type="tel"/></div>
<div class="col-12"><label class="form-label small fw-bold">Email Address</label><input autocomplete="email" class="form-control form-control-lg" name="email" placeholder="you@example.com" required="" type="email"/></div>
<div class="col-12"><label class="form-label small fw-bold">Create Password</label><input class="form-control form-control-lg" minlength="8" name="password" placeholder="Minimum 8 characters" required="" type="password"/></div><div class="col-12"><label class="form-label small fw-bold">Confirm Password</label><input autocomplete="new-password" class="form-control form-control-lg" minlength="8" name="confirmPassword" placeholder="Re-enter password" required="" type="password"/></div>
</div>
<div class="form-check my-4"><input class="form-check-input" id="termsAgree" required="" type="checkbox"/><label class="form-check-label small" for="termsAgree">I agree to the demo template terms and privacy notice.</label></div>
<button class="btn btn-vitaharbor-primary btn-lg w-100 py-3 mb-3" type="submit">Create Client Account</button>
<div class="vh-auth-divider"><span>or sign up with</span></div>
<div class="vh-social">
<button data-vh-social="google" type="button"><i class="bi bi-google me-2"></i>Google</button>
<button data-vh-social="apple" type="button"><i class="bi bi-apple me-2"></i>Apple</button>
</div>
<div aria-live="polite" class="vh-auth-message" data-vh-auth-message="" role="status"></div>
</form>
<div class="text-center border-top pt-3 mt-4">
<span class="small text-muted">Already have an account? <a class="fw-bold text-primary" href="login.html">Log In</a></span>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/aureon.bundle.js"></script></body>
</html>
