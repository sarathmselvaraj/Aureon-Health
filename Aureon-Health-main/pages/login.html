<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Aureon Health</title>
<meta content="Secure login portal for Aureon Health clients." name="description"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="../assets/images/favicon.svg" rel="icon" type="image/svg+xml"/><link href="../assets/css/aureon.bundle.css" rel="stylesheet"/></head>
<body class="bg-surface-subtle vh-auth-page page-login aureon-auth-clean">
<!-- TOP UTILITY STRIP -->
<div class="container">
<div class="row justify-content-center">
<div class="col-md-6 col-lg-5">
<div class="p-4 vh-auth-card p-md-5 shadow-lg surebridge-card">
<!-- Brand Header -->
<div class="text-center mb-4">

<a class="navbar-brand-logo d-inline-flex mb-2" href="../index.html">
<img alt="Aureon Health logo" class="brand-logo-mark" src="../assets/images/aureon-health-mark.svg"/><span class="brand-wordmark"><strong>Aureon Health</strong><span>Insurance</span></span></a>
<h3 class="fw-bold mt-2" data-vh-login-heading="">Welcome Back</h3>
<p class="text-muted small">Sign in to access your policy documents and claims.</p>
</div>
<form class="needs-validation" data-vh-login-form="" novalidate="">
<div class="mb-3">
<label class="form-label small fw-bold">Email Address</label>
<input autocomplete="email" class="form-control form-control-lg" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div class="mb-3">
<label class="form-label small fw-bold">Password</label>
<div class="input-group">
<input autocomplete="current-password" class="form-control form-control-lg" id="login-password" name="password" placeholder="Enter password" required="" type="password"/>
<button aria-label="Show password" class="btn btn-outline-secondary" data-toggle-password="" type="button"><i class="bi bi-eye"></i></button>
</div>
</div>
<input name="role" type="hidden" value="client"/>
<div class="form-check mb-4">
<input checked="" class="form-check-input" id="rememberMe" type="checkbox"/>
<label class="form-check-label small" for="rememberMe">Remember this browser</label>
</div>
<button class="btn btn-vitaharbor-primary btn-lg w-100 py-3 mb-3" type="submit">Sign In Securely</button>
<div class="vh-auth-divider"><span>or continue with</span></div>
<div class="vh-social">
<button data-vh-social="google" type="button"><i class="bi bi-google me-2"></i>Google</button>
<button data-vh-social="apple" type="button"><i class="bi bi-apple me-2"></i>Apple</button>
</div>
<div aria-live="polite" class="vh-auth-message" data-vh-auth-message="" role="status"></div>
</form>
<div class="text-center border-top pt-3">
<span class="small text-muted">Don't have an account? <a class="fw-bold text-primary" href="register.html">Register Free</a></span>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/aureon.bundle.js"></script></body>
</html>
